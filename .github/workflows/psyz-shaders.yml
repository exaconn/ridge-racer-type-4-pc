name: PsyZ D3D12 shaders

# Regenerates PsyZ's DXIL shader headers (psyz/src/platform/shaders/*_dxil.h)
# with the Windows SDK dxc, which macOS and Linux lack, and runs the PsyZ test
# suite on the D3D12 backend (hidden window) with them. The headers are
# uploaded as an artifact to commit to PsyZ; the SPIR-V/MSL headers are left
# as committed.

on:
  workflow_dispatch:
    inputs:
      psyz_ref:
        description: PsyZ branch or commit to build the shaders of
        required: false
        default: rr4
        type: string

permissions:
  contents: read

jobs:
  dxil:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CI: 1
      PSYZ_HEADLESS: gpu
      SDL_VIDEODRIVER: offscreen
      SDL_AUDIO_DRIVER: dummy
      SDL_AUDIODRIVER: dummy
      SDL_GPU_DRIVER: direct3d12
    steps:
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
      - uses: msys2/setup-msys2@61f9e5e925871ba6c9e3e8da24ede83ea27fa91f # v2.27.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            vim
            mingw-w64-ucrt-x86_64-glslang
            mingw-w64-ucrt-x86_64-spirv-cross
      - name: Fetch PsyZ and SDL
        shell: bash
        run: |
          git submodule update --init third_party/psyz
          git -C third_party/psyz fetch origin "${{ inputs.psyz_ref }}"
          git -C third_party/psyz checkout --detach FETCH_HEAD
          git -C third_party/psyz submodule update --init external/SDL external/cimgui
          git -C third_party/psyz log --oneline -1
      - name: Regenerate the DXIL headers
        shell: msys2 {0}
        run: |
          set -eu
          dxc_dir=$(ls -d "/c/Program Files (x86)/Windows Kits/10/bin/"10.*/x64 | sort -V | tail -1)
          export PATH="$dxc_dir:$PATH"
          dxc --version || true
          cd third_party/psyz/psyz/src/platform/shaders
          sh build_shaders.sh
          # Only DXIL comes from here; keep the committed SPIR-V and MSL.
          git checkout -- '*_spv.h' '*_msl.h'
          git status --short .
          grep -h '_revision' *_dxil.h
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: psyz-dxil-headers
          path: third_party/psyz/psyz/src/platform/shaders/*_dxil.h
          if-no-files-found: error
      - name: Build the PsyZ tests (MinGW, with the new headers)
        shell: msys2 {0}
        run: |
          cmake -S third_party/psyz/psyz/tests -B build/psyz-tests -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/psyz-tests --parallel 4
      - name: PsyZ tests on D3D12 (hidden window)
        shell: msys2 {0}
        working-directory: third_party/psyz/psyz/tests
        run: |
          set -o pipefail
          ../../../../build/psyz-tests/psyz_tests.exe --verbose 2>&1 | tee psyz-tests.log
      - name: GPU tests named by the rasterizer change
        if: always()
        shell: msys2 {0}
        working-directory: third_party/psyz/psyz/tests
        run: |
          set -o pipefail
          ../../../../build/psyz-tests/psyz_tests.exe --list | grep -iE 'native_rasterization|fuzz|mask|clut|polyline' || true
          ../../../../build/psyz-tests/psyz_tests.exe --verbose \
            '--filter=gpu::native_rasterization_matches_ps1_gpu,*fuzz*,*mask*,*clut*,*polyline*' 2>&1 | tee gpu-tests.log
          grep -iE 'direct3d12|d3d12|revision|fallback' psyz-tests.log gpu-tests.log | head -20 || true
      - name: Upload test failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: psyz-d3d12-test-failures
          path: |
            third_party/psyz/psyz/tests/expected/*.actual.png
            third_party/psyz/psyz/tests/*.log
          if-no-files-found: ignore
