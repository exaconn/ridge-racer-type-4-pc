name: Release Linux
run-name: Release ${{ inputs.version || github.ref_name }} (Linux)

# Builds the game for Linux x86-64 and ARM64 and attaches
# Ridge-Racer-Type-4-<version>-linux-<arch>.tar.gz to the release <version>.
# See docs/RELEASING.md.

on:
  push:
    tags:
      - "[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to attach the packages to (e.g. 0.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-linux-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version || github.ref_name }}
  PSYZ_HEADLESS: "1"
  SDL_AUDIODRIVER: dummy

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.version) || github.ref }}
          submodules: false
      - name: Install SDL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxtst-dev libxinerama-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libvulkan-dev \
            libdrm-dev libgbm-dev libasound2-dev libpulse-dev libudev-dev \
            libdbus-1-dev
      - name: Fetch PsyZ and SDL
        run: |
          git submodule update --init third_party/psyz
          git -C third_party/psyz submodule update --init external/SDL
      - name: Configure
        run: >-
          cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build/release --parallel 4
      - name: Unit tests (no game data)
        run: ctest --test-dir build/release --output-on-failure --no-tests=error
      - name: Package
        run: |
          set -euo pipefail
          package="Ridge-Racer-Type-4-${VERSION}-linux-${{ matrix.arch }}"
          mkdir -p "dist/${package}"
          cp build/release/ridge-racer-type-4-pc "dist/${package}/"
          strip "dist/${package}/ridge-racer-type-4-pc"
          cp packaging/icon/ridge-racer-type-4.png "dist/${package}/"
          packaging/stage.sh "dist/${package}" build/release
          ldd build/release/ridge-racer-type-4-pc > "dist/${package}/runtime-dependencies.txt"
          tar -czf "dist/${package}.tar.gz" -C dist "${package}"
          tar -tzf "dist/${package}.tar.gz" > package-list.txt && grep -q "^${package}/ridge-racer-type-4-pc$" package-list.txt
          grep -q "^${package}/source-commit.txt$" package-list.txt
          grep -q "^${package}/licenses/libwebp/COPYING$" package-list.txt
          sha256sum "dist/${package}.tar.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Ridge-Racer-Type-4-${{ env.VERSION }}-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 60); do
            gh release view "$VERSION" > /dev/null 2>&1 && break
            echo "Waiting for release $VERSION..."
            sleep 30
          done
          gh release upload "$VERSION" dist/*.tar.gz --clobber
