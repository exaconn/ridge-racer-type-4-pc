name: Main Executable (SCES_017.06) - Ridge Racer Type 4 (PAL)
sha1: f607c67df8f2a08d1bcd7f8d630cd16d92c3c2bc
options:
  basename: main
  target_path: assets/PAL/main.exe
  base_path: ../..
  platform: psx
  compiler: GCC

  asm_path: asm/PAL/main
  src_path: src/main/PAL
  build_path: build/PAL
  ld_script_path: linkers/PAL/main.ld

  find_file_boundaries: True
  use_legacy_include_asm: True
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  generate_asm_macros_files: False

  section_order: [".rodata", ".text", ".data", ".sdata", ".sbss", ".bss"]

  symbol_addrs_path:
    - configs/PAL/sym.main.txt
  undefined_funcs_auto_path: linkers/PAL/undefined_funcs_auto.main.txt
  undefined_syms_auto_path: linkers/PAL/undefined_syms_auto.main.txt

  subalign: 4
  string_encoding: ASCII
  data_string_encoding: ASCII
  ld_bss_is_noload: True

# PS-X EXE layout for SCES_017.06:
#   header   0x000000 - 0x000800
#   image    @ vram 0x80010000, size 0x9C000, ends @ 0x800AC000
#   entry PC = 0x8007D718, stack = 0x801FFFF0
# Game code beyond this image is overlaid from R4.BIN (see docs/overlays.md).
segments:
  - name: header
    type: header
    start: 0x0

  - name: main
    type: code
    start: 0x800
    vram: 0x80010000
    align: 4
    subsegments:
      - [0x800, rodata, main]
      - [0x2A08, asm, main]
      - [0x8E714, data, main]

  - [0x9C800]
